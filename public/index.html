<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Chat con Node.js y Sockets</title>

    <!-- NUEVO: estilos para mensajes propios y ajenos-->
    <!-- NUEVO: letra Poppins desde Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: "Poppins", sans-serif;
            color: #1f2937;
            max-width: 700px;
            padding: 16px;
        }
        h1 { color: #1e3a5f; font-weight: 600; }

        /* Campos y botones */
        input {
            font-family: inherit;
            padding: 8px 12px;
            border: 1px solid #b8c4d4;
            border-radius: 20px;
            outline: none;
        }
        input:focus { border-color: #2563eb; }
        button {
            font-family: inherit;
            padding: 8px 16px;
            border: none;
            border-radius: 20px;
            background: #2563eb;
            color: white;
            cursor: pointer;
        }
        button:hover { background: #1d4ed8; }

        /* Mensajes */
        #mensajes { list-style: none; padding: 0; display: flex; flex-direction: column; }
        #mensajes li {
            max-width: 60%;
            margin: 4px 0;
            padding: 8px 12px;
            border-radius: 12px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12);
            word-wrap: break-word;
        }
        /* Mensajes propios: azul */
        .propio {
            background:  #1e40af;
            color: white;
            margin-left: auto;
            text-align: right;
            border-bottom-right-radius: 4px;
        }
        /* Mensajes ajenos: gris */
        .ajeno {
            background: #e2e6ec;
            color: #1f2937;
            margin-right: auto;
            border-bottom-left-radius: 4px;
        }
        /* NUEVO: nombre arriba del mensaje */
        .nombre { font-size: 0.8em; font-weight: 600; margin-bottom: 2px; }
        .propio .nombre { color: #c7dcff; }
        .ajeno .nombre { color: #1e3a8a; }
    </style>
    
</head>
<body>
    <h1>Chat en tiempo real</h1>

    <!-- NUEVO: pantalla para pedir el nombre antes de entrar al chat -->
    <div id="pantallaNombre">
        <input
            type="text"
            id="nombre"
            placeholder="Escribe tu nombre..."
        >
        <button onclick="entrarChat()">
            Entrar
        </button>
    </div>

    <!-- NUEVO: el chat queda oculto hasta que se ingrese el nombre -->
    <div id="chat" style="display: none;">
    <input
        type="text"
        id="mensaje"
        placeholder="Escribe un mensaje..."
    >
    <button onclick="enviarMensaje()">
        Enviar
    </button>

    <ul id="mensajes"></ul>
    </div>

    <script src="/socket.io/socket.io.js"></script>

    <script>
        // Conectar con el servidor
        const socket = io();

        // NUEVO: nombre del usuario
        let nombreUsuario = "";

        // NUEVO: guardar el nombre y mostrar el chat
        function entrarChat() {
            const inputNombre = document.getElementById("nombre");

            if (inputNombre.value.trim() !== "") {
                nombreUsuario = inputNombre.value.trim();
                document.getElementById("pantallaNombre").style.display = "none";
                document.getElementById("chat").style.display = "block";
                document.getElementById("mensaje").focus();
            }
        }

        // Enviar mensaje
        function enviarMensaje() {
            const input = document.getElementById("mensaje");

            if (input.value.trim() !== "") {
                // NUEVO: se envía el nombre junto con el texto
                socket.emit("mensaje", { nombre: nombreUsuario, texto: input.value });
                input.value = "";
            }
        }

        // Recibir mensajes
        // socket.on("mensaje", (texto) => {
        //     const lista = document.getElementById("mensajes");
        //     const item = document.createElement("li");

        //     item.textContent = texto;
        //     lista.appendChild(item);
        // });

        // NUEVO: recibir {id, texto} y asignar clase según quién envió
        socket.on("mensaje", ({ id, nombre, texto }) => {
            const lista = document.getElementById("mensajes");
            const item = document.createElement("li");

            // NUEVO: nombre arriba del mensaje
            const etiquetaNombre = document.createElement("div");
            etiquetaNombre.classList.add("nombre");
            etiquetaNombre.textContent = nombre;

            const etiquetaTexto = document.createElement("div");
            etiquetaTexto.textContent = texto;

            item.appendChild(etiquetaNombre);
            item.appendChild(etiquetaTexto);
            item.classList.add(id === socket.id ? "propio" : "ajeno");
            lista.appendChild(item);
        });

        //anterior
        // socket.on("mensaje", ({ id, texto }) => {
        //     const lista = document.getElementById("mensajes");
        //     const item = document.createElement("li");
        
        //     item.textContent = texto;
        //     item.classList.add(id === socket.id ? "propio" : "ajeno");
        //     lista.appendChild(item);
        // });
    </script>
</body>
</html>
